name: CI/CD - Biblioteca Flask

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: acervo_user
          POSTGRES_PASSWORD: acervo_pass
          POSTGRES_DB: acervo_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U acervo_user -d acervo_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://acervo_user:acervo_pass@localhost:5432/acervo_db

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

      - name: Instalar dependências
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: |
          pip install flake8
          flake8 . || true

      - name: Criar pasta de relatório
        run: mkdir -p reports

      - name: Testes com coverage
        env:
          FLASK_ENV: testing
          PYTHONPATH: .
        run: |
          pip install coverage pytest
          coverage run -m pytest -v
          coverage xml -o reports/coverage.xml

      - name: Salvar relatório
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: reports/

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Instalar Railway CLI
        run: |
          curl -fsSL https://railway.app/install.sh | sh
          echo "$HOME/.railway/bin" >> $GITHUB_PATH

      - name: Deploy para Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up --service ProjetoAcervo
  
